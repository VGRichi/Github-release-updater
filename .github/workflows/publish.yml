# When you publish a release on GitHub, this attaches Reforge.zip to it, and
# publishes to the PowerShell Gallery if a repository secret named PSGALLERY_API_KEY is set
# (Settings > Secrets and variables > Actions).
name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check the tag matches the module version
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'.TrimStart('v')
          $manifest = Test-ModuleManifest ./Reforge/Reforge.psd1
          if ($manifest.Version.ToString() -ne $tag) {
            throw "Release tag v$tag doesn't match ModuleVersion $($manifest.Version) in Reforge.psd1"
          }

      - name: Run tests
        shell: pwsh
        run: ./build/invoke-tests.ps1 -CI

      - name: Build help (Get-Help XML and Update-Help files)
        shell: pwsh
        run: ./build/Build-Help.ps1 -Cab

      - name: Attach module zip and Update-Help files to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path ./Reforge -DestinationPath ./Reforge.zip
          $helpFiles = (Get-ChildItem ./out/help -File).FullName
          gh release upload '${{ github.event.release.tag_name }}' ./Reforge.zip $helpFiles --clobber

      - name: Publish to PowerShell Gallery
        if: ${{ env.PSGALLERY_API_KEY != '' }}
        shell: pwsh
        run: Publish-PSResource -Path ./Reforge -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY