# When you publish a release on GitHub (tag like v1.0.0), this runs the tests, builds reforge for
# Windows, macOS and Linux (x64 and ARM64), and attaches the files and their checksums to the release.
name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Passed through env, never pasted into scripts, so a tag name can't inject code
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check the tag is a version
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Release tag $RELEASE_TAG isn't a version like v1.0.0" && exit 1
          fi

      - name: Test
        run: go test ./...

      # File names have no version, so .../releases/latest/download/reforge_windows_amd64.zip always works
      - name: Build
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}"
            name="reforge_${os}_${arch}"
            exe=reforge; [ "$os" = windows ] && exe=reforge.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$version" -o "build/$name/$exe" ./cmd/reforge
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd "build/$name" && zip -q "../../dist/$name.zip" *)
            else
              tar -czf "dist/$name.tar.gz" -C "build/$name" .
            fi
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
